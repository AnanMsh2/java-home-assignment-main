server:
  port: 5080

spring:
  datasource:
    url: jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

    properties:
      hibernate:
        format_sql: false

# Swagger UI: http://localhost:5080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
